[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icarus-coding-harness"
version = "0.1.0"
description = "Approval-first coding-agent runtime for ICARUS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
icarus-harness = "icarus_harness.cli:main"

[tool.setuptools.packages.find]
include = ["icarus_harness*"]
