name: Personal Companion tests

on:
  push:
    paths:
      - "Harness/Tools/Personal Companion/**"
      - ".github/workflows/personal-companion.yml"
  pull_request:
    paths:
      - "Harness/Tools/Personal Companion/**"
      - ".github/workflows/personal-companion.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        working-directory: Harness/Tools/Personal Companion
        run: python -m pip install -e .
      - name: Run tests
        working-directory: Harness/Tools/Personal Companion
        run: python -m unittest discover -s tests -v

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Check UI JavaScript
        working-directory: Harness/Tools/Personal Companion/ui
        run: pnpm check
      - name: Run UI contract tests
        working-directory: Harness/Tools/Personal Companion/ui
        run: pnpm test
