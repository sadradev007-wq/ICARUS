name: Idea Architect tests

on:
  push:
    paths:
      - "Harness/Tools/Idea Architect/**"
      - ".github/workflows/idea-architect-tests.yml"
  pull_request:
    paths:
      - "Harness/Tools/Idea Architect/**"
      - ".github/workflows/idea-architect-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: "Harness/Tools/Idea Architect"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
