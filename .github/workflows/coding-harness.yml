name: Coding Harness tests

on:
  push:
    branches: [main]
    paths:
      - "Harness/Coding(turng_Mirza)/icarus-coding-harness/**"
      - "Local LLM/**"
      - ".github/workflows/coding-harness.yml"
  pull_request:
    paths:
      - "Harness/Coding(turng_Mirza)/icarus-coding-harness/**"
      - "Local LLM/**"
      - ".github/workflows/coding-harness.yml"
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: "Harness/Coding(turng_Mirza)/icarus-coding-harness"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q icarus_harness tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
